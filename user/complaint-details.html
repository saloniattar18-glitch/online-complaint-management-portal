<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Complaint Details | Complaint Portal</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />

    <link rel="stylesheet" href="../assets/css/style.css" />

    <link rel="stylesheet" href="../assets/css/user.css" />
  </head>

  <body class="user-panel">
    <section id="container">
      <header class="header black-bg">
        <div class="sidebar-toggle-box">
          <i class="fa fa-bars"></i>
        </div>

        <a href="dashboard.html" class="logo">
          <b>
            Complaint
            <span>Portal</span>
          </b>
        </a>

        <ul class="top-menu">
          <li>
            <a href="#" class="logout" data-logout> Logout </a>
          </li>
        </ul>
      </header>

      <aside>
        <div id="sidebar">
          <div class="sidebar-profile">
            <div class="profile-avatar" data-user-initial>U</div>

            <h5 data-user-name>User</h5>

            <p data-user-role>User</p>
          </div>

          <ul class="sidebar-menu">
            <li>
              <a href="dashboard.html">
                <i class="fa fa-dashboard"></i>
                Dashboard
              </a>
            </li>

            <li>
              <a href="submit-complaint.html">
                <i class="fa fa-plus-circle"></i>
                Submit Complaint
              </a>
            </li>

            <li>
              <a href="complaints.html">
                <i class="fa fa-file-text"></i>
                My Complaints
              </a>
            </li>

            <li>
              <a href="profile.html">
                <i class="fa fa-user"></i>
                My Profile
              </a>
            </li>

            <li>
              <a href="feedback.html">
                <i class="fa fa-star"></i>
                Feedback
              </a>
            </li>
          </ul>
        </div>
      </aside>

      <section id="main-content">
        <section class="wrapper">
          <div class="page-title-row">
            <div>
              <h2>Complaint Details</h2>

              <p>View complete information about your complaint.</p>
            </div>

            <a href="complaints.html" class="btn btn-light">
              <i class="fa fa-arrow-left"></i>
              Back
            </a>
          </div>

          <div id="complaintDetails">
            <div class="loader"></div>
          </div>

          <div class="portal-card">
            <div class="panel-header">
              <h4>Complaint Actions</h4>
            </div>

            <a
              href="complaint-status.html"
              id="trackStatusLink"
              class="btn btn-info"
            >
              <i class="fa fa-history"></i>
              Track Status
            </a>

            <a href="feedback.html" id="feedbackLink" class="btn btn-warning">
              <i class="fa fa-star"></i>
              Give Feedback
            </a>
          </div>
        </section>
      </section>
    </section>

    <script src="../assets/js/common.js"></script>
    <script src="../assets/js/user.js"></script>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const params = new URLSearchParams(window.location.search);
        const id = params.get("id");

        if (!id) {
          return;
        }

        const trackStatusLink = document.getElementById("trackStatusLink");

        const feedbackLink = document.getElementById("feedbackLink");

        if (trackStatusLink) {
          trackStatusLink.href =
            "complaint-status.html?id=" + encodeURIComponent(id);
        }

        if (feedbackLink) {
          feedbackLink.href = "feedback.html?id=" + encodeURIComponent(id);
        }
      });
    </script>
  </body>
</html>
