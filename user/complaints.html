<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>My Complaints | Complaint Portal</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />

    <link rel="stylesheet" href="../assets/css/style.css" />

    <link rel="stylesheet" href="../assets/css/user.css" />
  </head>

  <body class="user-panel">
    <section id="container">
      <header class="header black-bg">
        <div class="sidebar-toggle-box">
          <i class="fa fa-bars"></i>
        </div>

        <a href="dashboard.html" class="logo">
          <b>
            Complaint
            <span>Portal</span>
          </b>
        </a>

        <ul class="top-menu">
          <li>
            <a href="#" class="logout" data-logout> Logout </a>
          </li>
        </ul>
      </header>

      <aside>
        <div id="sidebar">
          <div class="sidebar-profile">
            <div class="profile-avatar" data-user-initial>U</div>

            <h5 data-user-name>User</h5>

            <p data-user-role>User</p>
          </div>

          <ul class="sidebar-menu">
            <li>
              <a href="dashboard.html">
                <i class="fa fa-dashboard"></i>
                Dashboard
              </a>
            </li>

            <li>
              <a href="submit-complaint.html">
                <i class="fa fa-plus-circle"></i>
                Submit Complaint
              </a>
            </li>

            <li>
              <a href="complaints.html">
                <i class="fa fa-file-text"></i>
                My Complaints
              </a>
            </li>

            <li>
              <a href="profile.html">
                <i class="fa fa-user"></i>
                My Profile
              </a>
            </li>

            <li>
              <a href="feedback.html">
                <i class="fa fa-star"></i>
                Feedback
              </a>
            </li>
          </ul>
        </div>
      </aside>

      <section id="main-content">
        <section class="wrapper">
          <div class="page-title-row">
            <div>
              <h2>My Complaints</h2>

              <p>View and track all complaints you have submitted.</p>
            </div>

            <a href="submit-complaint.html" class="btn btn-theme">
              <i class="fa fa-plus"></i>
              New Complaint
            </a>
          </div>

          <!-- FILTERS -->
          <div class="filter-bar">
            <div class="filter-row">
              <div class="filter-item">
                <label for="complaintSearch"> Search </label>

                <div class="search-box">
                  <i class="fa fa-search"></i>

                  <input
                    type="text"
                    id="complaintSearch"
                    class="form-control"
                    placeholder="Search complaints..."
                  />
                </div>
              </div>

              <div class="filter-item">
                <label for="statusFilter"> Status </label>

                <select id="statusFilter" class="form-control">
                  <option value="">All Status</option>

                  <option value="pending">Pending</option>

                  <option value="assigned">Assigned</option>

                  <option value="in_progress">In Progress</option>

                  <option value="resolved">Resolved</option>

                  <option value="closed">Closed</option>

                  <option value="rejected">Rejected</option>
                </select>
              </div>

              <div class="filter-item">
                <label for="categoryFilter"> Category ID </label>

                <input
                  type="number"
                  id="categoryFilter"
                  class="form-control"
                  min="1"
                  placeholder="All categories"
                />
              </div>

              <div class="filter-actions">
                <button
                  type="button"
                  id="filterComplaints"
                  class="btn btn-theme"
                >
                  <i class="fa fa-filter"></i>
                  Filter
                </button>
              </div>
            </div>
          </div>

          <!-- COMPLAINT LIST -->
          <div id="complaintsList" class="user-complaint-list">
            <div class="loader"></div>
          </div>
        </section>
      </section>
    </section>

    <script src="../assets/js/common.js"></script>
    <script src="../assets/js/user.js"></script>
  </body>
</html>
