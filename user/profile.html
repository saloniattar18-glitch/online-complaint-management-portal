<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>My Profile | Complaint Portal</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />

    <link rel="stylesheet" href="../assets/css/style.css" />

    <link rel="stylesheet" href="../assets/css/user.css" />
  </head>

  <body class="user-panel">
    <section id="container">
      <header class="header black-bg">
        <div class="sidebar-toggle-box">
          <i class="fa fa-bars"></i>
        </div>

        <a href="dashboard.html" class="logo">
          <b>
            Complaint
            <span>Portal</span>
          </b>
        </a>

        <ul class="top-menu">
          <li>
            <a href="#" class="logout" data-logout> Logout </a>
          </li>
        </ul>
      </header>

      <aside>
        <div id="sidebar">
          <div class="sidebar-profile">
            <div class="profile-avatar" data-user-initial>U</div>

            <h5 data-user-name>User</h5>

            <p data-user-role>User</p>
          </div>

          <ul class="sidebar-menu">
            <li>
              <a href="dashboard.html">
                <i class="fa fa-dashboard"></i>
                Dashboard
              </a>
            </li>

            <li>
              <a href="submit-complaint.html">
                <i class="fa fa-plus-circle"></i>
                Submit Complaint
              </a>
            </li>

            <li>
              <a href="complaints.html">
                <i class="fa fa-file-text"></i>
                My Complaints
              </a>
            </li>

            <li>
              <a href="profile.html">
                <i class="fa fa-user"></i>
                My Profile
              </a>
            </li>

            <li>
              <a href="feedback.html">
                <i class="fa fa-star"></i>
                Feedback
              </a>
            </li>
          </ul>
        </div>
      </aside>

      <section id="main-content">
        <section class="wrapper">
          <div class="page-header">
            <h2>My Profile</h2>

            <p>View and update your personal information.</p>
          </div>

          <div class="user-profile-layout">
            <!-- PROFILE CARD -->
            <div>
              <div class="profile-card">
                <div class="profile-avatar-lg" data-user-initial>U</div>

                <h3 data-user-name>User</h3>

                <p data-user-email>user@example.com</p>

                <span class="status-badge status-active"> Active User </span>
              </div>
            </div>

            <!-- PROFILE FORM -->
            <div>
              <div class="form-panel">
                <div class="panel-header">
                  <h4>Personal Information</h4>
                </div>

                <form id="profileForm">
                  <div class="form-row">
                    <div class="form-group">
                      <label for="full_name"> Full Name </label>

                      <input
                        type="text"
                        id="full_name"
                        name="full_name"
                        class="form-control"
                        required
                      />
                    </div>

                    <div class="form-group">
                      <label for="email"> Email Address </label>

                      <input
                        type="email"
                        id="email"
                        name="email"
                        class="form-control"
                        required
                      />
                    </div>
                  </div>

                  <div class="form-row">
                    <div class="form-group">
                      <label for="mobile"> Mobile Number </label>

                      <input
                        type="tel"
                        id="mobile"
                        name="mobile"
                        class="form-control"
                        maxlength="10"
                        placeholder="Enter mobile number"
                      />
                    </div>

                    <div class="form-group">
                      <label for="username"> Username </label>

                      <input
                        type="text"
                        id="username"
                        name="username"
                        class="form-control"
                        placeholder="Enter username"
                      />
                    </div>
                  </div>

                  <div class="form-group">
                    <label for="address"> Address </label>

                    <textarea
                      id="address"
                      name="address"
                      class="form-control"
                      rows="4"
                      placeholder="Enter your address"
                    ></textarea>
                  </div>

                  <button type="submit" class="btn btn-theme">
                    <i class="fa fa-save"></i>
                    Save Changes
                  </button>
                </form>
              </div>
            </div>
          </div>
        </section>
      </section>
    </section>

    <script src="../assets/js/common.js"></script>
    <script src="../assets/js/user.js"></script>
  </body>
</html>
