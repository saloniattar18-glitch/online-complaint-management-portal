<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>404 - Page Not Found | Complaint Portal</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />

    <link rel="stylesheet" href="assets/css/style.css" />
  </head>

  <body>
    <div class="error-page">
      <div class="error-container">
        <div class="error-code">404</div>

        <div class="error-icon">
          <i class="fa fa-exclamation-circle"></i>
        </div>

        <h1>Page Not Found</h1>

        <p>
          The page you are trying to access does not exist or may have been
          moved.
        </p>

        <div class="error-actions">
          <a href="index.html" class="btn btn-theme">
            <i class="fa fa-home"></i>
            Go to Home
          </a>

          <a href="user/login.html" class="btn btn-light"> User Login </a>
        </div>
      </div>
    </div>

    <script src="assets/js/common.js"></script>
  </body>
</html>
