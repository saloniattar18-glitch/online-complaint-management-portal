<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Complaint Details | Complaint Portal</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />

    <link rel="stylesheet" href="../assets/css/style.css" />

    <link rel="stylesheet" href="../assets/css/admin.css" />
  </head>

  <body class="admin-panel">
    <section id="container">
      <header class="header black-bg">
        <div class="sidebar-toggle-box">
          <i class="fa fa-bars"></i>
        </div>

        <a href="dashboard.html" class="logo">
          <b>
            Complaint
            <span>Portal</span>
          </b>
        </a>

        <ul class="top-menu">
          <li>
            <a href="#" class="logout" data-logout> Logout </a>
          </li>
        </ul>
      </header>

      <aside>
        <div id="sidebar">
          <div class="sidebar-profile">
            <div class="profile-avatar" data-user-initial>A</div>

            <h5 data-user-name>Administrator</h5>

            <p data-user-role>Admin</p>
          </div>

          <ul class="sidebar-menu">
            <li>
              <a href="dashboard.html">
                <i class="fa fa-dashboard"></i>
                Dashboard
              </a>
            </li>

            <li>
              <a href="complaints.html">
                <i class="fa fa-file-text"></i>
                Complaints
              </a>
            </li>

            <li>
              <a href="users.html">
                <i class="fa fa-users"></i>
                Users
              </a>
            </li>

            <li>
              <a href="categories.html">
                <i class="fa fa-tags"></i>
                Categories
              </a>
            </li>

            <li>
              <a href="departments.html">
                <i class="fa fa-building"></i>
                Departments
              </a>
            </li>

            <li>
              <a href="staff.html">
                <i class="fa fa-user-secret"></i>
                Staff
              </a>
            </li>

            <li>
              <a href="reports.html">
                <i class="fa fa-bar-chart"></i>
                Reports
              </a>
            </li>

            <li>
              <a href="messages.html">
                <i class="fa fa-envelope"></i>
                Messages
              </a>
            </li>

            <li>
              <a href="profile.html">
                <i class="fa fa-user"></i>
                Profile
              </a>
            </li>
          </ul>
        </div>
      </aside>

      <section id="main-content">
        <section class="wrapper">
          <div class="page-title-row">
            <div>
              <h2>Complaint Details</h2>

              <p>Review, assign and update complaint.</p>
            </div>

            <a href="complaints.html" class="btn btn-light">
              <i class="fa fa-arrow-left"></i>
              Back
            </a>
          </div>

          <div class="admin-two-column">
            <!-- LEFT -->
            <div>
              <div id="adminComplaintDetails">
                <div class="loader"></div>
              </div>
            </div>

            <!-- RIGHT -->
            <div>
              <!-- ASSIGN -->
              <div class="admin-panel-card">
                <div class="panel-header">
                  <h4>Assign Complaint</h4>
                </div>

                <form id="assignComplaintForm">
                  <div class="form-group">
                    <label for="department_id"> Department </label>

                    <select
                      id="department_id"
                      name="department_id"
                      class="form-control"
                      required
                    >
                      <option value="">Loading departments...</option>
                    </select>
                  </div>

                  <div class="form-group">
                    <label for="staff_id"> Staff Member </label>

                    <select
                      id="staff_id"
                      name="staff_id"
                      class="form-control"
                      required
                    >
                      <option value="">Loading staff...</option>
                    </select>
                  </div>

                  <button type="submit" class="btn btn-theme02 btn-block">
                    <i class="fa fa-user-plus"></i>
                    Assign Complaint
                  </button>
                </form>
              </div>

              <!-- STATUS -->
              <div class="admin-panel-card">
                <div class="panel-header">
                  <h4>Update Status</h4>
                </div>

                <form id="adminStatusForm">
                  <div class="form-group">
                    <label for="status"> Status </label>

                    <select
                      id="status"
                      name="status"
                      class="form-control"
                      required
                    >
                      <option value="pending">Pending</option>

                      <option value="assigned">Assigned</option>

                      <option value="in_progress">In Progress</option>

                      <option value="resolved">Resolved</option>

                      <option value="closed">Closed</option>

                      <option value="rejected">Rejected</option>
                    </select>
                  </div>

                  <div class="form-group">
                    <label for="remarks"> Remarks </label>

                    <textarea
                      id="remarks"
                      name="remarks"
                      class="form-control"
                      rows="4"
                      placeholder="Enter status remarks..."
                    ></textarea>
                  </div>

                  <button type="submit" class="btn btn-success btn-block">
                    <i class="fa fa-refresh"></i>
                    Update Status
                  </button>
                </form>
              </div>
            </div>
          </div>
        </section>
      </section>
    </section>

    <script src="../assets/js/common.js"></script>
    <script src="../assets/js/admin.js"></script>
  </body>
</html>
